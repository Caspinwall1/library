<body>
  <h1>My Library</h1>
  <button id="new-book-btn">New Book</button>

<form id="book-form" style="display:none;">
  <input
    type="text"
    id="title"
    placeholder="Book Title"
    required
  >

  <input
    type="text"
    id="author"
    placeholder="Author"
    required
  >

  <input
    type="number"
    id="pages"
    placeholder="Pages"
    required
  >

  <label>
    Read?
    <input type="checkbox" id="hasRead">
  </label>

  <button type="submit">Add Book</button>
</form>

  <div id="library-container"></div>

  <script src="script.js"></script>
</body>
